cases:
  - id: TC-MRT-001
    scenario: SC-MRT-001
    description: 100ms 이상 유휴 뒤 첫 changed 이벤트가 동기적으로 화면에 반영된다
    type: normal
    expected: { result: success, leading_immediate: true }
  - id: TC-MRT-002
    scenario: SC-MRT-001
    description: 60회 연속 상태 변경에서 각 일반 탭의 전체 교체가 12회 이하이고 emit p95가 1.8ms 이하다
    type: boundary
    expected: { result: success, max_replacements: 12, max_emit_p95_ms: 1.8 }
  - id: TC-MRT-003
    scenario: SC-MRT-002
    description: 숨김 중 만료된 trailing 갱신이 복귀 때 한 번 반영되고 다음 burst도 정상 처리된다
    type: error
    expected: { result: success, restore_renders: 1 }
  - id: TC-MRT-004
    scenario: SC-MRT-002
    description: pending 상태의 강제 refresh와 destroy 취소 뒤 예약 렌더가 재실행되지 않는다
    type: error
    expected: { result: success, stale_renders: 0 }
  - id: TC-MRT-005
    scenario: SC-MRT-003
    description: 목표 값 변경은 전체 교체 없이 ID별 수치만 갱신하고 구조 변경은 정확히 한 번 재생성한다
    type: boundary
    expected: { result: success, value_replacements: 0, structure_replacements: 1, scroll_preserved: true }
  - id: TC-MRT-006
    scenario: SC-MRT-003
    description: HUD 값·ARIA·진행바와 390px 가로 폭이 기존 가독성 회귀를 통과한다
    type: normal
    expected: { result: success, overflow: false }
  - id: TC-MRT-007
    scenario: SC-MRT-004
    description: 첫 700ms에는 Firebase SDK 요청이 없고 첫 입력 이후 기존 Firestore SDK가 로드된다
    type: boundary
    expected: { result: success, startup_sdk_requests: 0 }
  - id: TC-MRT-008
    scenario: SC-MRT-005
    description: 전체 단위·빌드·오프라인·보스·작전피버·가독성·직접 플레이 회귀가 통과한다
    type: error
    expected: { result: success, errors: 0 }
  - id: TC-MRT-009
    scenario: SC-MRT-006
    description: 250ms 간격 연속 입력 중 Firebase SDK 요청은 없고 마지막 입력 700~1400ms 뒤 시작한다
    type: boundary
    expected: { result: success, requests_during_input: 0 }
  - id: TC-MRT-010
    scenario: SC-MRT-006
    description: 무입력은 페이지 진입 약 5초에 시작하고 랭킹 진입은 300ms 안에 즉시 시작한다
    type: boundary
    expected: { result: success, deadline_ms: 5000, leaderboard_max_ms: 300 }
  - id: TC-MRT-011
    scenario: SC-MRT-007
    description: Galmuri9·14 subset 뒤 전체 폰트 전송은 600KB 이하다
    type: normal
    expected: { result: success, max_transfer_bytes: 600000 }
  - id: TC-MRT-012
    scenario: SC-MRT-007
    description: 작은 정적 문구는 Galmuri9, 굵은 정적 문구와 숫자 101은 Galmuri14, 희귀 한글은 Galmuri11 fallback을 실제 사용한다
    type: error
    expected: { result: success }
  - id: TC-MRT-013
    scenario: SC-MRT-007
    description: 같은 소스에서 subset 생성 스크립트를 두 번 실행하면 동일 SHA-256과 더 작은 WOFF2가 나온다
    type: boundary
    expected: { result: success, deterministic: true }
  - id: TC-MRT-014
    scenario: SC-MRT-008
    description: Phaser 3.90.0과 esbuild 0.27.7에서 custom bundle을 두 번 만들면 동일 SHA, MIT 배너, 양 renderer flag와 200KB 이하 gzip을 얻고 소스의 factory·Math·제외 API 사용이 custom entry와 일치한다
    type: boundary
    expected: { result: success, deterministic: true, max_gzip_bytes: 200000 }
  - id: TC-MRT-015
    scenario: SC-MRT-008
    description: WebGL custom core가 사용 factory와 input·loader·scale·time·tween을 제공하고 실제 canvas 탭을 처리한다
    type: normal
    expected: { result: success, renderer_type: 2, tap_increment: 1 }
  - id: TC-MRT-016
    scenario: SC-MRT-008
    description: WebGL을 강제로 비활성화하면 Canvas fallback이 부팅되고 같은 API·탭·다색상 프레임을 제공한다
    type: error
    expected: { result: success, renderer_type: 1, min_sampled_colors: 4 }
  - id: TC-MRT-017
    scenario: SC-MRT-009
    description: GAEPYO_STOCK_PHASER=1이 custom 준비·alias를 우회해 깨진 custom cache를 건드리지 않고 stock production build와 WebGL·Canvas 런타임을 정상 제공한다
    type: error
    expected: { result: success, rollback_available: true }
  - id: TC-MRT-018
    scenario: SC-MRT-009
    description: 4× CPU 3회 중앙값에서 custom은 stock보다 전송 30%, 총 long task 25%, 최대 long task 15% 이상 작다
    type: boundary
    expected: { result: success, max_custom_transfer_bytes: 200000 }
