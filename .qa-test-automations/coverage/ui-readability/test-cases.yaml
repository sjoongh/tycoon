cases:
  - id: TC-UIR-001
    scenario: SC-UIR-001
    description: 작전 회의가 열려 있는 동안 구역·보상 배너가 뒤에서 겹치지 않는다
    type: normal
    expected: { result: success, max_central_messages: 1 }
  - id: TC-UIR-002
    scenario: SC-UIR-001
    description: 동일 보상은 중복 제거되고 위기·구역·보상 순으로 직렬화된다
    type: boundary
    expected: { result: success, first_tone: danger }
  - id: TC-UIR-003
    scenario: SC-UIR-002
    description: HUD 라벨은 10px, 관련 본문은 11px 이상이다
    type: normal
    expected: { result: success }
  - id: TC-UIR-004
    scenario: SC-UIR-002
    description: 360px와 390px에서 가로 넘침이 없고 설정 버튼은 44px 이상이다
    type: boundary
    expected: { result: success }
  - id: TC-UIR-005
    scenario: SC-UIR-003
    description: 구역·체제 진행률 50%가 scaleX(0.5)로 렌더된다
    type: normal
    expected: { result: success }
  - id: TC-UIR-006
    scenario: SC-UIR-003
    description: reduced-motion에서 진행바와 중앙 알림 transition이 제거된다
    type: boundary
    expected: { result: success }
  - id: TC-UIR-007
    scenario: SC-UIR-004
    description: 전체 단위 테스트와 작전·피버 결정적 E2E가 회귀 없이 통과한다
    type: error
    expected: { result: success }
  - id: TC-UIR-008
    scenario: SC-UIR-004
    description: 상태 주입 없는 90초 플레이에서 작전·피버·피니셔·재정비 횟수가 일치한다
    type: normal
    expected: { result: success, errors: 0 }
