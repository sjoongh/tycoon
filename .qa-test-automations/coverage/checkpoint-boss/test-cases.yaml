cases:
  - id: TC-BOSS-001
    scenario: SC-BOSS-001
    description: 3의 배수 구역만 순환 보스를 반환한다
    type: boundary
    input: { areas: [2, 3, 18, 21] }
    expected: { result: success, checkpoints: [3, 18, 21] }
  - id: TC-BOSS-002
    scenario: SC-BOSS-001
    description: 목표와 보너스 공식을 경계값까지 계산한다
    type: boundary
    input: { cps: 10, click_power: 5, base_reward: 999 }
    expected: { target: 140, bonus: 349 }
  - id: TC-BOSS-003
    scenario: SC-BOSS-001
    description: 일반 구역은 즉시 완료하고 3구역은 보스 성공 뒤 완료한다
    type: normal
    expected: { area: 4, operation_draft_area: 3, bonus_pct: 35 }
  - id: TC-BOSS-004
    scenario: SC-BOSS-002
    description: 시간 만료는 기본 보상으로 진행한다
    type: boundary
    expected: { outcome: failed, penalty: none, bonus_votes: 0 }
  - id: TC-BOSS-005
    scenario: SC-BOSS-002
    description: 건너뛰기는 기본 보상으로 진행한다
    type: normal
    expected: { outcome: skipped, penalty: none, bonus_votes: 0 }
  - id: TC-BOSS-006
    scenario: SC-BOSS-003
    description: 만료된 진행 저장을 실패 완료 상태로 복구한다
    type: error
    expected: { active: false, boss_required: false, stage_advance: allowed }
  - id: TC-BOSS-007
    scenario: SC-BOSS-004
    description: 보스 UI는 세계 탭을 통과시키고 중앙 모달과 겹치지 않는다
    type: normal
    expected: { world_tap_increment: 1, central_boss_cards: 1, operation_modals: 0, overflow: false }
  - id: TC-BOSS-008
    scenario: SC-BOSS-004
    description: 작전 모달 직후 연타를 무시하고 재접속을 복구한다
    type: error
    expected: { premature_operation_pick: false, restored_outcome: failed, touch_target_min_px: 44 }
