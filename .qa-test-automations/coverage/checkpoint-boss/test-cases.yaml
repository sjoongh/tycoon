cases:
  - id: TC-BOSS-001
    scenario: SC-BOSS-001
    description: 3의 배수 구역만 순환 보스를 반환한다
    type: boundary
    input: { areas: [2, 3, 18, 21] }
    expected: { result: success, checkpoints: [3, 18, 21] }
  - id: TC-BOSS-002
    scenario: SC-BOSS-001
    description: 목표와 보너스 공식을 경계값까지 계산한다
    type: boundary
    input: { cps: 10, click_power: 5, base_reward: 999 }
    expected: { target: 140, bonus: 349 }
  - id: TC-BOSS-003
    scenario: SC-BOSS-001
    description: 일반 구역은 즉시 완료하고 3구역은 보스 성공 뒤 완료한다
    type: normal
    expected: { area: 4, operation_draft_area: 3, bonus_pct: 35 }
  - id: TC-BOSS-004
    scenario: SC-BOSS-002
    description: 시간 만료는 기본 보상으로 진행한다
    type: boundary
    expected: { outcome: failed, penalty: none, bonus_votes: 0 }
  - id: TC-BOSS-005
    scenario: SC-BOSS-002
    description: 건너뛰기는 기본 보상으로 진행한다
    type: normal
    expected: { outcome: skipped, penalty: none, bonus_votes: 0 }
  - id: TC-BOSS-006
    scenario: SC-BOSS-003
    description: 만료된 진행 저장을 실패 완료 상태로 복구한다
    type: error
    expected: { active: false, boss_required: false, stage_advance: allowed }
  - id: TC-BOSS-007
    scenario: SC-BOSS-004
    description: 보스 UI는 세계 탭을 통과시키고 중앙 모달과 겹치지 않는다
    type: normal
    expected: { world_tap_increment: 1, central_boss_cards: 1, operation_modals: 0, overflow: false }
  - id: TC-BOSS-008
    scenario: SC-BOSS-004
    description: 작전 모달 직후 연타를 무시하고 재접속을 복구한다
    type: error
    expected: { premature_operation_pick: false, restored_outcome: failed, touch_target_min_px: 44 }
  - id: TC-BOSS-009
    scenario: SC-BOSS-005
    description: 전반 세 보스는 단일 패턴을 가르치고 후반 세 보스는 승인된 패턴만 조합한다
    type: boundary
    expected: { early_phases: [[rapid], [alternate], [timing]], final_phases: [rapid, alternate, timing] }
  - id: TC-BOSS-010
    scenario: SC-BOSS-005
    description: 연타 보스는 직접 탭만 세고 자동 생산과 수치 진행 API를 무시한다
    type: negative
    expected: { tap_progress: 1, passive_progress: 0, throughput_bypass: 0 }
  - id: TC-BOSS-011
    scenario: SC-BOSS-005
    description: 좌우 교대는 잘못된 쪽을 거절하고 다음 정답 쪽을 표시한다
    type: negative
    expected: { wrong_progress: 0, correct_progress: 1, next_side: right }
  - id: TC-BOSS-012
    scenario: SC-BOSS-005
    description: 타이밍 봉인은 이른 입력을 거절하고 NOW 구간 입력만 인정한다
    type: boundary
    expected: { early_progress: 0, hot_progress: 1 }
  - id: TC-BOSS-013
    scenario: SC-BOSS-006
    description: 18구역 보스가 연타 4회, 교대 4회, 타이밍 1회를 순서대로 완료한다
    type: normal
    expected: { phases: 3, total_target: 9, outcome: success }
  - id: TC-BOSS-014
    scenario: SC-BOSS-007
    description: 구버전 throughput 목표와 패턴 단계·타이밍 원점을 각각 복구한다
    type: compatibility
    expected: { legacy_target_preserved: true, patterned_phase_preserved: true, expiry_unblocks: true }
  - id: TC-BOSS-015
    scenario: SC-BOSS-006
    description: 모바일·데스크톱과 키보드 단계 전환, 라이브 피드백, reduced-motion을 검증한다
    type: accessibility
    expected: { touch_target_min_px: 44, focus_handoff: true, live_feedback: true, overflow: false, reduced_motion: true }
