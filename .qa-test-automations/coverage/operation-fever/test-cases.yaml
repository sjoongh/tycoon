cases:
  - id: TC-OPF-001
    scenario: SC-OPF-001
    description: 같은 run/area/선택 상태는 같은 세 장을 반환한다
    type: normal
    expected: { result: success }
  - id: TC-OPF-002
    scenario: SC-OPF-001
    description: 12종은 계열별 4종이고 드래프트는 계열별 한 장이다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-003
    scenario: SC-OPF-002
    description: v3 구 세이브는 새 작전·피버 필드로 정규화된다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-004
    scenario: SC-OPF-002
    description: 드래프트에 없는 작전 선택은 거부된다
    type: error
    expected: { result: error }
  - id: TC-OPF-005
    scenario: SC-OPF-002
    description: 유효 작전은 레벨을 올리고 열기 12를 지급한다
    type: normal
    expected: { result: success }
  - id: TC-OPF-006
    scenario: SC-OPF-002
    description: 1·2구역에는 드래프트가 없고 3구역 완료에만 열린다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-007
    scenario: SC-OPF-002
    description: 계열 동률은 마지막 선택 계열로 결정한다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-008
    scenario: SC-OPF-003
    description: 현장 피버는 12초 동안 탭 3배·생산 2배다
    type: normal
    expected: { result: success, ui_state: tap-fever }
  - id: TC-OPF-009
    scenario: SC-OPF-003
    description: 운영 피버는 생산 5배·증설 추가 25% 할인이다
    type: normal
    expected: { result: success, ui_state: build-fever }
  - id: TC-OPF-010
    scenario: SC-OPF-003
    description: 대응 피버는 사건·브리핑 대기를 풀고 대응 보상을 2배로 만든다
    type: normal
    expected: { result: success, ui_state: response-fever }
  - id: TC-OPF-011
    scenario: SC-OPF-003
    description: 자동 비서 사건은 사용자 대신 열기를 채우지 않는다
    type: error
    expected: { result: success }
  - id: TC-OPF-012
    scenario: SC-OPF-004
    description: 피니셔는 마지막 4초에 한 번만 허용된다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-013
    scenario: SC-OPF-004
    description: 피버 종료 결산 뒤 30초 재충전을 막는다
    type: boundary
    expected: { result: success, ui_state: recovery }
  - id: TC-OPF-014
    scenario: SC-OPF-002
    description: 감사 후 작전·피버·결산·재정비가 초기화된다
    type: boundary
    expected: { result: success }
  - id: TC-OPF-015
    scenario: SC-OPF-004
    description: 모바일·데스크톱에서 추천·현황·피버·피니셔·비차단 결산이 동작한다
    type: normal
    expected: { result: success, ui_state: complete-cycle }
  - id: TC-OPF-016
    scenario: SC-OPF-005
    description: 상태 주입 없는 180초 고강도 플레이에서 작전은 3구역 주기이고 피버와 재정비 횟수가 짝을 이룬다
    type: normal
    expected: { result: success }
